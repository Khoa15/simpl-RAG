# Local/production-like stack. Copy .env.example to .env and fill in secrets first.
x-app-env: &app-env
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  JWT_SECRET: ${JWT_SECRET}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  UPLOAD_DIR: /data/uploads

x-app-base: &app-base
  build: ./be
  restart: unless-stopped
  environment: *app-env
  volumes:
    - uploads:/data/uploads
    - models:/app/.cache
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *app-base
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *app-base
    ports: []
    command: celery -A src.celery_worker:celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}

  beat:
    <<: *app-base
    ports: []
    command: celery -A src.celery_worker:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  qdrant-data:
  uploads:
  models:
